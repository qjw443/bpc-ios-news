name: build-unsigned-ipa

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-unsigned.yml"

jobs:
  build:
    name: Build unsigned IPA (no signing)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        continue-on-error: true
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Prepare Xcode project
        working-directory: ios
        run: |
          if [ -d BPCNews.xcodeproj ]; then
            echo "== using checked-in BPCNews.xcodeproj =="
            python3 tools/check_xcodeproj.py
          else
            echo "== generating project with XcodeGen =="
            brew install xcodegen
            xcodegen generate
          fi
          ls -la
          ls -la BPCNews.xcodeproj

      - name: Build (code signing disabled)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project BPCNews.xcodeproj \
            -scheme BPCNews \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build.log | tail -80
          echo "---- 断言产物 ----"
          APP="build/Build/Products/Release-iphoneos/BPCNews.app"
          test -d "$APP"
          test -f "$APP/BPCNews"
          echo "binary ok: $(ls -lh "$APP/BPCNews" | awk '{print $5}')"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: ignore

      - name: Package unsigned IPA
        working-directory: ios
        run: |
          APP="build/Build/Products/Release-iphoneos/BPCNews.app"
          test -d "$APP" || { echo "app not found"; find build -name "*.app" -maxdepth 6; exit 1; }
          rm -rf Payload BPCNews-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry BPCNews-unsigned.ipa Payload
          echo "---- artifacts ----"
          ls -lh BPCNews-unsigned.ipa
          echo "---- app info ----"
          BID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "CFBundleIdentifier=$BID"
          test -n "$BID" || { echo "!! Info.plist 缺 CFBundleIdentifier"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist" || true
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true
          echo "---- binary ----"
          file "$APP/BPCNews"
          ls -lh "$APP/BPCNews"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BPCNews-unsigned-ipa
          path: ios/BPCNews-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
