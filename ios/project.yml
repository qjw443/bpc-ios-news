name: BPCNews

options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_BITCODE: NO
    SWIFT_EMIT_LOC_STRINGS: NO

targets:
  BPCNews:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: BPCNews
        excludes:
          - "Info.plist"
          - "BPCNews.entitlements"
    info:
      path: BPCNews/Info.plist
      properties:
        CFBundleDisplayName: 财经速递
        CFBundleName: BPCNews
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        UIBackgroundModes:
          - fetch
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: BPCNews/BPCNews.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.bpcnews
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: BackgroundTasks.framework
      - sdk: AVFoundation.framework

schemes:
  BPCNews:
    build:
      targets:
        BPCNews: all
    run:
      config: Debug
    archive:
      config: Release
